name: tests

on:
  pull_request:
    branches: [main, uat, dev]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml hypothesis ruff
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: ruff check . .githooks/pre-commit .githooks/commit-msg
      - run: python scripts/hooks/slop_checks.py $(git ls-files '*.py')
      - run: python -m pytest -q
