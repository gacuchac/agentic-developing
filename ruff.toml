line-length = 120

[lint]
# Each rule replaces a judgement a review rubric used to make (see "Rule → what enforces it" in CLAUDE.md).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PIE", "ANN", "D1", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "ARG", "ERA", "PGH", "FIX"]
ignore = ["D100", "D104", "D105", "D107"]

[lint.per-file-ignores]
"tests/**" = ["ANN", "D1", "ARG", "E402", "E501", "PLR0913"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 7
